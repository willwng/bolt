name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WARP_CACHE_PATH: ${{ github.workspace }}/.warp_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (the default Linux wheel pulls in CUDA)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      # Compiling the Warp kernels dominates a cold run, so reuse the kernel cache across runs
      - uses: actions/cache@v4
        with:
          path: ${{ env.WARP_CACHE_PATH }}
          key: warp-${{ runner.os }}-${{ hashFiles('bolt/**/*.py', 'pyproject.toml') }}
          restore-keys: warp-${{ runner.os }}-

      - name: Run tests
        run: pytest -rxX --durations=10
