[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt"
version = "0.0.1"
description = "Bolt: Musculoskeletal Simulation"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bolt-test = "bolt.test:main"

[tool.setuptools.packages.find]
include = ["bolt*"]
