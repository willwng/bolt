[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt"
version = "0.0.1"
description = "Bolt: Musculoskeletal Simulation"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"  # OpenSim's Python wheels support 3.11-3.13
dependencies = [
    "warp-lang>=1.16,<2",
    "numpy",
    "torch",
    "scipy",
    "opensim>=4.6,<5",
    "pyvista",
    "pyglet",
    "tqdm",
]

[project.scripts]
bolt-test = "bolt.test:main"

[tool.setuptools.packages.find]
include = ["bolt*"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
